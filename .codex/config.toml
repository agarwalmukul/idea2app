[features]
codex_hooks = true

[mcp_servers.code-review-graph]
command = "uvx"
args = ["code-review-graph", "serve", "--repo", "."]

[mcp_servers.code-review-graph.env]
PYTHONUTF8 = "1"

[mcp_servers.token-savior-recall]
command = "uvx"
args = ["--from", "token-savior-recall[mcp]", "token-savior"]

[mcp_servers.token-savior-recall.env]
WORKSPACE_ROOTS = "."
TOKEN_SAVIOR_CLIENT = "codex"
TOKEN_SAVIOR_PROFILE = "ultra"
TS_MEMORY_DISABLE = "1"
TS_CAPTURE_DISABLED = "1"
TS_HOOK_MINIMAL = "1"
TS_NO_HINTS = "1"
